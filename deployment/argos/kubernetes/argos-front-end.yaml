# Argos — dashboard web. Relaie /graphql, /auth, /files et /mcp vers l'API.
#   kubectl -n argos apply -f argos-front-end.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argos-front-end
  labels:
    app.kubernetes.io/name: argos-front-end
    app.kubernetes.io/part-of: argos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: argos-front-end
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argos-front-end
        app.kubernetes.io/part-of: argos
    spec:
      serviceAccountName: argos
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: front-end
          image: registry.devana.ai/devana/argos-front-end:1.0.0
          ports:
            - { name: http, containerPort: 3100 }
          env:
            - name: SERVEUR_URL
              value: http://argos-api:4000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: argos-front-end
  labels:
    app.kubernetes.io/name: argos-front-end
spec:
  selector:
    app.kubernetes.io/name: argos-front-end
  ports:
    - { name: http, port: 3100, targetPort: http }
