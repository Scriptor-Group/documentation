# Argos — Redis DÉDIÉ (files de traitement d'Argos, Odin et Zeus, base 0).
# Ne pas utiliser le Redis d'une plateforme Devana : Odin y consommerait ses
# demandes. Sa perte est tolérée (files reconstruites depuis la base).
#   kubectl -n argos apply -f redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argos-redis
  labels:
    app.kubernetes.io/name: argos-redis
    app.kubernetes.io/part-of: argos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argos-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argos-redis
        app.kubernetes.io/part-of: argos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          # Refuser les écritures plutôt qu'évincer des tâches.
          args: ["redis-server", "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: argos-redis
  labels:
    app.kubernetes.io/name: argos-redis
spec:
  selector:
    app.kubernetes.io/name: argos-redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
